version: 0.1
component: build
timeoutInSeconds: 1200
shell: bash
failImmediatelyOnError: true

env:
  variables:
    JAVA_HOME: /usr/lib64/graalvm/graalvm-java22
  exportedVariables:
    - IMAGE_TAG

steps:
  - type: Command
    name: "Install Java 22"
    command: |
      yum -y install graalvm-22-jdk.x86_64
      export PATH=$JAVA_HOME/bin:$PATH
      java -version

  - type: Command
    name: "Create image tag"
    command: |
      IMAGE_TAG=$(echo ${OCI_BUILD_RUN_ID} | rev | cut -c 1-12)
      echo "IMAGE_TAG=${IMAGE_TAG}"

  - type: Command
    name: "Build Spring Boot and React app"
    command: |
      export PATH=$JAVA_HOME/bin:$PATH
      cd MtdrSpring/backend
      chmod +x mvnw
      ./mvnw -DskipTests clean package spring-boot:repackage

  - type: Command
    name: "Build Docker image"
    command: |
      cd MtdrSpring/backend
      docker build -f Dockerfile -t todolistapp-springboot:local .

outputArtifacts:
  - name: todolist-image
    type: DOCKER_IMAGE
    location: todolistapp-springboot:local