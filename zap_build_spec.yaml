version: 0.1
component: build
timeoutInSeconds: 10000
runAs: root
shell: bash

env:
  variables:
    # Change this in OCI Build Parameters when you run the pipeline.
    TARGET_URL: "https://replace-with-your-deployed-app-url"

steps:
  - type: Command
    timeoutInSeconds: 1200
    name: "OWASP ZAP Baseline Scan"
    command: |
      cd "${OCI_PRIMARY_SOURCE_DIR}"
      docker run --rm \
        -v "${OCI_PRIMARY_SOURCE_DIR}:/zap/wrk:rw" \
        --user root \
        ghcr.io/zaproxy/zaproxy:stable \
        zap-baseline.py \
        -t "${TARGET_URL}" \
        -x results.xml \
        -r zap_report.html \
        -J zap_report.json \
        -I
      ls -lah results.xml zap_report.html zap_report.json

outputArtifacts:
  - name: zap-results-xml
    type: BINARY
    location: ${OCI_PRIMARY_SOURCE_DIR}/results.xml
  - name: zap-report-html
    type: BINARY
    location: ${OCI_PRIMARY_SOURCE_DIR}/zap_report.html
  - name: zap-results-json
    type: BINARY
    location: ${OCI_PRIMARY_SOURCE_DIR}/zap_report.json