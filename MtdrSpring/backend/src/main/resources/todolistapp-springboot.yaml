apiVersion: v1
kind: Service
metadata:
  name: todolistapp-backend-router
spec:
  type: ClusterIP
  selector:
    app: todolistapp-springboot
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: todolistapp-springboot-deployment
spec:
  selector:
    matchLabels:
      app: todolistapp-springboot
  replicas: 1
  template:
    metadata:
      annotations:
        ci-build: "${IMAGE_TAG}"
      labels:
        app: todolistapp-springboot
        version: v1
    spec:
      containers:
        - name: todolistapp-springboot
          image: ${DOCKER_REGISTRY}/todolistapp-springboot:${IMAGE_TAG}
          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          env:
            - name: db_user
              value: "VANTAGE"

            - name: db_url
              value: "jdbc:oracle:thin:@%TODO_PDB_NAME%_tp?TNS_ADMIN=/mtdrworkshop/creds"

            - name: todo.table.name
              value: "todoitem"

            - name: driver_class_name
              value: "oracle.jdbc.OracleDriver"

            - name: OCI_REGION
              value: "%OCI_REGION%"

            - name: dbpassword
              valueFrom:
                secretKeyRef:
                  name: dbuser
                  key: dbpassword
                  optional: true

            - name: ui_username
              value: "%UI_USERNAME%"

            - name: ui_password
              valueFrom:
                secretKeyRef:
                  name: frontendadmin
                  key: password
                  optional: true

            - name: DEEPSEEK_API_KEY
              valueFrom:
                secretKeyRef:
                  name: gemini-api-secret
                  key: DEEPSEEK_API_KEY
                  optional: false

            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: telegram-bot-secret
                  key: TELEGRAM_BOT_TOKEN
                  optional: false

            - name: TELEGRAM_BOT_NAME
              value: "vantage_assistant_bot"

            - name: APP_FRONTEND_URL
              value: "https://vantage.myvnc.com"

            - name: OCI_IDENTITY_DOMAIN_URL
              value: "https://idcs-879a0028c89849abaf750ac7bfa02c12.identity.oraclecloud.com"

            - name: OCI_OAUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: oci-oauth-secret
                  key: OCI_OAUTH_CLIENT_ID
                  optional: false

            - name: OCI_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: oci-oauth-secret
                  key: OCI_OAUTH_CLIENT_SECRET
                  optional: false

          volumeMounts:
            - name: creds
              mountPath: /mtdrworkshop/creds

      restartPolicy: Always

      volumes:
        - name: creds
          secret:
            secretName: db-wallet-secret

      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: todolistapp-springboot